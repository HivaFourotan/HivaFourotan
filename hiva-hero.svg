<svg xmlns="http://www.w3.org/2000/svg" width="900" height="920" viewBox="0 0 900 920">
  <rect width="900" height="920" fill="#0a0f0a"/>

  <defs>
    <!-- ═══ گرادینت محو برای خوانایی متن ═══ -->
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#0a0f0a" stop-opacity="0.10"/>
      <stop offset="0.14" stop-color="#0a0f0a" stop-opacity="0.78"/>
      <stop offset="0.22" stop-color="#0a0f0a" stop-opacity="0.9"/>
      <stop offset="0.86" stop-color="#0a0f0a" stop-opacity="0.9"/>
      <stop offset="1"    stop-color="#0a0f0a" stop-opacity="0.78"/>
    </linearGradient>

    <!-- ═══ گرادینت امواج سبز ═══ -->
    <linearGradient id="waveG1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#1a4d2e"/>
      <stop offset="50%"  stop-color="#2ea043"/>
      <stop offset="100%" stop-color="#56d364"/>
    </linearGradient>
    <linearGradient id="waveG2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0d3320"/>
      <stop offset="50%"  stop-color="#1a4d2e"/>
      <stop offset="100%" stop-color="#238636"/>
    </linearGradient>
    <linearGradient id="waveG3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#56d364"/>
      <stop offset="50%"  stop-color="#8dffc2"/>
      <stop offset="100%" stop-color="#56d364"/>
    </linearGradient>

    <!-- ═══ الگوهای ماتریکس ═══ -->
    <g id="a" fill="#8dffc2" font-family="ui-monospace,monospace" font-size="11">
      <text y="13" opacity="0.07">1</text><text y="27" opacity="0.09">0</text><text y="41" opacity="0.12">1</text>
      <text y="55" opacity="0.16">1</text><text y="69" opacity="0.21">0</text><text y="83" opacity="0.27">1</text>
      <text y="97" opacity="0.34">0</text><text y="111" opacity="0.42">0</text><text y="125" opacity="0.50">1</text>
      <text y="139" opacity="0.58">1</text><text y="153" opacity="0.67">0</text><text y="167" opacity="0.76">1</text>
      <text y="181" opacity="0.85">0</text><text y="195" opacity="0.93">1</text>
      <text y="209" opacity="1" fill="#f4fff8">1</text>
    </g>
    <g id="b" fill="#8dffc2" font-family="ui-monospace,monospace" font-size="11">
      <text y="13" opacity="0.07">0</text><text y="27" opacity="0.09">1</text><text y="41" opacity="0.12">0</text>
      <text y="55" opacity="0.16">1</text><text y="69" opacity="0.21">1</text><text y="83" opacity="0.27">0</text>
      <text y="97" opacity="0.34">1</text><text y="111" opacity="0.42">0</text><text y="125" opacity="0.50">1</text>
      <text y="139" opacity="0.58">0</text><text y="153" opacity="0.67">0</text><text y="167" opacity="0.76">1</text>
      <text y="181" opacity="0.85">1</text><text y="195" opacity="0.93">0</text>
      <text y="209" opacity="1" fill="#f4fff8">1</text>
    </g>
    <g id="c" fill="#8dffc2" font-family="ui-monospace,monospace" font-size="11">
      <text y="13" opacity="0.07">1</text><text y="27" opacity="0.09">0</text><text y="41" opacity="0.12">0</text>
      <text y="55" opacity="0.16">1</text><text y="69" opacity="0.21">0</text><text y="83" opacity="0.27">1</text>
      <text y="97" opacity="0.34">1</text><text y="111" opacity="0.42">0</text><text y="125" opacity="0.50">1</text>
      <text y="139" opacity="0.58">0</text><text y="153" opacity="0.67">1</text><text y="167" opacity="0.76">1</text>
      <text y="181" opacity="0.85">0</text><text y="195" opacity="0.93">0</text>
      <text y="209" opacity="1" fill="#f4fff8">1</text>
    </g>
    <g id="pa"><use href="#a" y="0"/><use href="#a" y="-210"/><use href="#a" y="-420"/><use href="#a" y="-630"/><use href="#a" y="-840"/></g>
    <g id="pb"><use href="#b" y="0"/><use href="#b" y="-210"/><use href="#b" y="-420"/><use href="#b" y="-630"/><use href="#b" y="-840"/></g>
    <g id="pc"><use href="#c" y="0"/><use href="#c" y="-210"/><use href="#c" y="-420"/><use href="#c" y="-630"/><use href="#c" y="-840"/></g>

    <!-- ═══ کلیپ‌های تایپینگ ═══ -->
    <!-- خط ۱: 0-4s -->
    <clipPath id="tc1">
      <rect x="250" y="478" width="0" height="30">
        <animate attributeName="width"
          values="0;320;320;0;0;0;0;0"
          keyTimes="0;0.038;0.2;0.225;0.25;0.5;0.75;1"
          dur="16s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <!-- خط ۲: 4-8s -->
    <clipPath id="tc2">
      <rect x="250" y="478" width="0" height="30">
        <animate attributeName="width"
          values="0;0;320;320;0;0;0;0"
          keyTimes="0;0.25;0.288;0.45;0.475;0.5;0.75;1"
          dur="16s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <!-- خط ۳: 8-12s -->
    <clipPath id="tc3">
      <rect x="250" y="478" width="0" height="30">
        <animate attributeName="width"
          values="0;0;0;320;320;0;0;0"
          keyTimes="0;0.25;0.5;0.538;0.7;0.725;0.75;1"
          dur="16s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <!-- خط ۴: 12-16s -->
    <clipPath id="tc4">
      <rect x="250" y="478" width="0" height="30">
        <animate attributeName="width"
          values="0;0;0;0;320;320;0;0"
          keyTimes="0;0.25;0.5;0.75;0.788;0.95;0.975;1"
          dur="16s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!--                    🌧️ ماتریکس رین (کل صفحه)             -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <g><use href="#pa" x="8"/><use href="#pa" x="136"/><use href="#pa" x="264"/><use href="#pa" x="392"/><use href="#pa" x="520"/><use href="#pa" x="648"/><use href="#pa" x="776"/>
    <animateTransform attributeName="transform" type="translate" from="0 -210" to="0 0" dur="1.2s" begin="-0.2s" repeatCount="indefinite"/></g>
  <g opacity="0.82"><use href="#pb" x="24"/><use href="#pb" x="152"/><use href="#pb" x="280"/><use href="#pb" x="408"/><use href="#pb" x="536"/><use href="#pb" x="664"/><use href="#pb" x="792"/>
    <animateTransform attributeName="transform" type="translate" from="0 -210" to="0 0" dur="1.55s" begin="-0.85s" repeatCount="indefinite"/></g>
  <g opacity="0.7"><use href="#pc" x="40"/><use href="#pc" x="168"/><use href="#pc" x="296"/><use href="#pc" x="424"/><use href="#pc" x="552"/><use href="#pc" x="680"/><use href="#pc" x="808"/>
    <animateTransform attributeName="transform" type="translate" from="0 -210" to="0 0" dur="1.35s" begin="-1.1s" repeatCount="indefinite"/></g>
  <g opacity="0.9"><use href="#pa" x="56"/><use href="#pa" x="184"/><use href="#pa" x="312"/><use href="#pa" x="440"/><use href="#pa" x="568"/><use href="#pa" x="696"/><use href="#pa" x="824"/>
    <animateTransform attributeName="transform" type="translate" from="0 -210" to="0 0" dur="1.85s" begin="-0.45s" repeatCount="indefinite"/></g>
  <g opacity="0.76"><use href="#pb" x="72"/><use href="#pb" x="200"/><use href="#pb" x="328"/><use href="#pb" x="456"/><use href="#pb" x="584"/><use href="#pb" x="712"/><use href="#pb" x="840"/>
    <animateTransform attributeName="transform" type="translate" from="0 -210" to="0 0" dur="1.25s" begin="-1.4s" repeatCount="indefinite"/></g>
  <g opacity="0.64"><use href="#pc" x="88"/><use href="#pc" x="216"/><use href="#pc" x="344"/><use href="#pc" x="472"/><use href="#pc" x="600"/><use href="#pc" x="728"/><use href="#pc" x="856"/>
    <animateTransform attributeName="transform" type="translate" from="0 -210" to="0 0" dur="1.7s" begin="-0.3s" repeatCount="indefinite"/></g>
  <g opacity="0.58"><use href="#pa" x="104"/><use href="#pa" x="232"/><use href="#pa" x="360"/><use href="#pa" x="488"/><use href="#pa" x="616"/><use href="#pa" x="744"/><use href="#pa" x="872"/>
    <animateTransform attributeName="transform" type="translate" from="0 -210" to="0 0" dur="1.42s" begin="-0.95s" repeatCount="indefinite"/></g>
  <g opacity="0.86"><use href="#pb" x="120"/><use href="#pb" x="248"/><use href="#pb" x="376"/><use href="#pb" x="504"/><use href="#pb" x="632"/><use href="#pb" x="760"/><use href="#pb" x="888"/>
    <animateTransform attributeName="transform" type="translate" from="0 -210" to="0 0" dur="2s" begin="-1.55s" repeatCount="indefinite"/></g>

  <rect width="900" height="920" fill="url(#fade)"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!--                 🌊 امواج سبز متحرک بالا                 -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <g>
    <path d="M0,180 Q112.5,140 225,180 T450,180 T675,180 T900,180 T1125,180 T1350,180 T1575,180 T1800,180 L1800,0 L0,0 Z" fill="url(#waveG2)" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" from="0,0" to="-900,0" dur="18s" repeatCount="indefinite"/>
    </path>
    <path d="M0,150 Q112.5,110 225,150 T450,150 T675,150 T900,150 T1125,150 T1350,150 T1575,150 T1800,150 L1800,0 L0,0 Z" fill="url(#waveG1)">
      <animateTransform attributeName="transform" type="translate" from="0,0" to="-900,0" dur="12s" repeatCount="indefinite"/>
    </path>
    <path d="M0,130 Q112.5,90 225,130 T450,130 T675,130 T900,130 T1125,130 T1350,130 T1575,130 T1800,130 L1800,0 L0,0 Z" fill="url(#waveG3)" opacity="0.45">
      <animateTransform attributeName="transform" type="translate" from="0,0" to="-900,0" dur="8s" repeatCount="indefinite"/>
    </path>
    <text x="450" y="80" text-anchor="middle" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="1">I'm Hiva</text>
    <text x="450" y="112" text-anchor="middle" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="600" fill="#d1f7e0" letter-spacing="4">DEVELOPER · CODER · DREAMER</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!--                    🟩 کارت سبز                          -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="30" y="180" width="840" height="700" rx="20" fill="#0d1117" fill-opacity="0.55" stroke="#238636" stroke-width="1.5"/>

  <!-- ═══ ستون چپ ═══ -->
  <text x="60" y="240" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="42" font-weight="800" fill="#ffffff">Hiva </text>
  <text x="178" y="240" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="42" font-weight="800" fill="#8dffc2">Fourotan</text>
  <line x1="60" y1="260" x2="555" y2="260" stroke="#238636" stroke-width="1.5"/>

  <text x="60" y="298" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="20" font-weight="700" fill="#7ee787">Software Developer</text>
  <text x="60" y="326" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="500" fill="#56d364">Full-Stack · AI · Automation</text>

  <!-- ═══ Hiva-OS (متن پیکسلی سبز) ═══ -->
  <text x="60" y="410" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="46" font-weight="900" fill="#8dffc2" letter-spacing="6">Hiva-OS</text>
  <line x1="60" y1="428" x2="555" y2="428" stroke="#238636" stroke-width="1" opacity="0.6"/>

  <!-- ═══ تایپینگ (داخل کارت) ═══ -->
  <text x="250" y="498" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="700" fill="#8dffc2" clip-path="url(#tc1)">Hi 👋 I'm Hiva</text>
  <text x="250" y="498" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="700" fill="#8dffc2" clip-path="url(#tc2)">Full-Stack Developer</text>
  <text x="250" y="498" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="700" fill="#8dffc2" clip-path="url(#tc3)">Open Source Enthusiast</text>
  <text x="250" y="498" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="700" fill="#8dffc2" clip-path="url(#tc4)">Building cool stuff 🚀</text>
  <!-- نشانگر چشمک‌زن -->
  <rect x="572" y="482" width="2" height="18" fill="#8dffc2">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- ═══ توضیحات ═══ -->
  <text x="60" y="560" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="13" fill="#c9d1d9">I build web applications, explore AI-powered tools,</text>
  <text x="60" y="580" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="13" fill="#c9d1d9">and craft clean, efficient code. Currently a high</text>
  <text x="60" y="600" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="13" fill="#c9d1d9">school student passionate about open source.</text>

  <!-- ═══ نقل‌قول ═══ -->
  <text x="60" y="650" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="12" font-style="italic" fill="#8dffc2">"Code is my instrument, GitHub is my stage."</text>

  <!-- ═══ ستون راست ═══ -->
  <line x1="600" y1="210" x2="600" y2="820" stroke="#238636" stroke-width="1"/>
  <text x="630" y="238" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="12" font-weight="700" fill="#8dffc2" letter-spacing="1.5">AVAILABLE WORLDWIDE</text>
  <line x1="630" y1="252" x2="845" y2="252" stroke="#238636" stroke-width="1"/>

  <text x="630" y="296" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="12" font-weight="700" fill="#56d364">LOCATION</text>
  <text x="630" y="316" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="13" fill="#c9d1d9">Iran</text>

  <text x="630" y="362" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="12" font-weight="700" fill="#56d364">TIMEZONE</text>
  <text x="630" y="382" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="13" fill="#c9d1d9">Asia/Tehran</text>

  <text x="630" y="428" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="12" font-weight="700" fill="#56d364">FOCUS</text>
  <text x="630" y="448" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="13" fill="#c9d1d9">Web · AI</text>
  <text x="630" y="468" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="13" fill="#c9d1d9">Open Source</text>

  <!-- ═══ امضا + نقطه چشمک‌زن ═══ -->
  <line x1="60" y1="815" x2="845" y2="815" stroke="#238636" stroke-width="1"/>
  <text x="60" y="845" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#56d364">
    <tspan fill="#8dffc2">$</tspan> Hiva-OS v1.0 · Built with code &amp; rhythm 🎻
  </text>
  <circle cx="845" cy="840" r="4" fill="#8dffc2">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
</svg>
