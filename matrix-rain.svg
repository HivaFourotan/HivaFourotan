<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="200" viewBox="0 0 1000 200">
  <defs>
    <!-- گرادینت برای محو شدن به سمت پایین -->
    <linearGradient id="fadeToBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="black" stop-opacity="1" />
      <stop offset="40%" stop-color="black" stop-opacity="0.8" />
      <stop offset="70%" stop-color="black" stop-opacity="0.4" />
      <stop offset="100%" stop-color="black" stop-opacity="0" />
    </linearGradient>

    <!-- الگوی یک ستون از کاراکترها (برای تکرار استفاده می‌شود) -->
    <pattern id="matrixColumn" width="20" height="200" patternUnits="userSpaceOnUse">
      <text x="0" y="5" font-family="monospace" font-size="12" fill="#00FF41" opacity="0.8">1</text>
      <text x="0" y="20" font-family="monospace" font-size="12" fill="#00FF41" opacity="0.7">0</text>
      <text x="0" y="35" font-family="monospace" font-size="12" fill="#00FF41" opacity="0.6">1</text>
      <text x="0" y="50" font-family="monospace" font-size="12" fill="#00FF41" opacity="0.5">0</text>
      <text x="0" y="65" font-family="monospace" font-size="12" fill="#00FF41" opacity="0.4">1</text>
      <text x="0" y="80" font-family="monospace" font-size="12" fill="#00FF41" opacity="0.3">0</text>
      <text x="0" y="95" font-family="monospace" font-size="12" fill="#00FF41" opacity="0.2">1</text>
      <text x="0" y="110" font-family="monospace" font-size="12" fill="#00FF41" opacity="0.1">0</text>
    </pattern>

    <!-- ماسک برای اعمال محو شدن روی کل بک‌گراند -->
    <mask id="fadeMask">
      <rect width="100%" height="100%" fill="url(#fadeToBottom)" />
    </mask>
  </defs>

  <!-- بک‌گراند تیره اصلی -->
  <rect width="100%" height="100%" fill="#0d1117" />

  <!-- لایه باران ماتریکس که با ماسک محو می‌شود -->
  <g mask="url(#fadeMask)">
    <!-- ردیف اول ستون‌های باران -->
    <rect x="0" y="0" width="100%" height="100%" fill="url(#matrixColumn)" opacity="0.9">
      <animate attributeName="y" from="-200" to="0" dur="4s" repeatCount="indefinite" />
    </rect>
    <!-- ردیف دوم با کمی تاخیر برای عمق بیشتر -->
    <rect x="10" y="0" width="100%" height="100%" fill="url(#matrixColumn)" opacity="0.6">
      <animate attributeName="y" from="-150" to="50" dur="6s" repeatCount="indefinite" />
    </rect>
    <!-- ردیف سوم برای پراکندگی بیشتر -->
    <rect x="-15" y="0" width="100%" height="100%" fill="url(#matrixColumn)" opacity="0.4">
      <animate attributeName="y" from="-100" to="100" dur="8s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
