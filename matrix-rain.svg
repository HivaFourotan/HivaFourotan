<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="200" viewBox="0 0 1000 200">
  <defs>
    <!-- گرادینت برای محو شدن به سمت پایین -->
    <linearGradient id="fadeToBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="black" stop-opacity="1" />
      <stop offset="50%" stop-color="black" stop-opacity="0.6" />
      <stop offset="85%" stop-color="black" stop-opacity="0.2" />
      <stop offset="100%" stop-color="black" stop-opacity="0" />
    </linearGradient>

    <!-- الگوی یک ستون از کاراکترها -->
    <pattern id="matrixColumn" width="20" height="200" patternUnits="userSpaceOnUse">
      <text x="0" y="10" font-family="monospace" font-size="14" fill="#00FF41" opacity="0.9">1</text>
      <text x="0" y="30" font-family="monospace" font-size="14" fill="#00FF41" opacity="0.8">0</text>
      <text x="0" y="50" font-family="monospace" font-size="14" fill="#00FF41" opacity="0.7">1</text>
      <text x="0" y="70" font-family="monospace" font-size="14" fill="#00FF41" opacity="0.6">0</text>
      <text x="0" y="90" font-family="monospace" font-size="14" fill="#00FF41" opacity="0.5">1</text>
      <text x="0" y="110" font-family="monospace" font-size="14" fill="#00FF41" opacity="0.4">0</text>
      <text x="0" y="130" font-family="monospace" font-size="14" fill="#00FF41" opacity="0.3">1</text>
      <text x="0" y="150" font-family="monospace" font-size="14" fill="#00FF41" opacity="0.2">0</text>
      <text x="0" y="170" font-family="monospace" font-size="14" fill="#00FF41" opacity="0.1">1</text>
      <text x="0" y="190" font-family="monospace" font-size="14" fill="#00FF41" opacity="0.05">0</text>
    </pattern>

    <!-- ماسک برای اعمال محو شدن -->
    <mask id="fadeMask">
      <rect width="100%" height="100%" fill="url(#fadeToBottom)" />
    </mask>
  </defs>

  <!-- بک‌گراند تیره -->
  <rect width="100%" height="100%" fill="#0d1117" />

  <!-- لایه باران ماتریکس با انیمیشن CSS -->
  <g mask="url(#fadeMask)">
    <rect class="rain-layer" x="0" y="0" width="100%" height="100%" fill="url(#matrixColumn)" opacity="0.8" />
    <rect class="rain-layer" x="10" y="0" width="100%" height="100%" fill="url(#matrixColumn)" opacity="0.5" />
    <rect class="rain-layer" x="-15" y="0" width="100%" height="100%" fill="url(#matrixColumn)" opacity="0.3" />
  </g>

  <style>
    /* انیمیشن حرکت به سمت پایین */
    @keyframes fall {
      from {
        transform: translateY(-200px);
      }
      to {
        transform: translateY(0);
      }
    }

    /* اعمال انیمیشن به لایه‌های باران با سرعت‌های متفاوت */
    .rain-layer {
      animation: fall 4s linear infinite;
    }
    .rain-layer:nth-child(2) {
      animation-duration: 6s;
      animation-delay: -2s;
    }
    .rain-layer:nth-child(3) {
      animation-duration: 8s;
      animation-delay: -4s;
    }
  </style>
</svg>
